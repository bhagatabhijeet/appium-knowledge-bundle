<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Appium Knowledge Bundle</title>
  <desc id="description">A documentation-first knowledge bundle for Appium mobile automation, covering architecture, languages, and platforms.</desc>
  <rect width="1200" height="300" fill="#f5f7f2"/>

  <rect x="0" y="0" width="10" height="300" fill="#1e5d52"/>

  <text x="60" y="118" font-family="sans-serif" font-size="46" font-weight="700" fill="#17251f">Appium Knowledge Bundle</text>
  <text x="60" y="156" font-family="sans-serif" font-size="20" fill="#50645a">Structured, verifiable notes for Appium mobile automation</text>

  <g font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="60" y="196" width="150" height="56" rx="10" fill="#dcefe8" stroke="#1e5d52" stroke-width="2"/>
    <text x="135" y="230" fill="#17251f">Android</text>

    <rect x="226" y="196" width="150" height="56" rx="10" fill="#e8e4f3" stroke="#4e477b" stroke-width="2"/>
    <text x="301" y="230" fill="#282445">iOS</text>

    <rect x="392" y="196" width="150" height="56" rx="10" fill="#f3e6ce" stroke="#9a6a2f" stroke-width="2"/>
    <text x="467" y="230" fill="#4c351a">Windows</text>
  </g>

  <g font-family="sans-serif" font-size="15" fill="#50645a" text-anchor="end">
    <text x="1140" y="196">One WebDriver API</text>
    <text x="1140" y="220">Multiple client languages</text>
    <text x="1140" y="244">W3C WebDriver protocol</text>
  </g>
</svg>
