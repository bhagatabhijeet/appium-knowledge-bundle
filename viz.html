<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}

  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}

  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;

}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }

#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }

#detail-body code {

  border-radius: 3px;
  font-size: 12px;

  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;

#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }

        <dt>Verified</dt><dd id="detail-verified"></dd>

      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>

    </article>
  </section>
</main>

},"verified":[],"stale_after":"","sources":[],"trust_tier":"unverified","stale":false,"color":"#1e5d52","size":36}}],"edges":[{"data":{"id":"introduction/what-is-appium__introduction/supported-languages","source":"introduction/what-is-appium","target":"introduction/supported-languages"}},{"data":{"id":"introduction/tool-comparison__driver-ecosystem/uiautomator2-vs-espresso","source":"introduction/tool-comparison","target":"driver-ecosystem/uiautomator2-vs-espresso"}},{"data":{"id":"introduction/setup-options__introduction/limitations","source":"introduction/setup-options","target":"introduction/limitations"}},{"data":{"id":"introduction/setup-options__introduction/advantages","source":"introduction/setup-options","target":"introduction/advantages"}},{"data":{"id":"introduction/setup-options__appium-setup/prerequisites","source":"introduction/setup-options","target":"appium-setup/prerequisites"}},{"data":{"id":"introduction/limitations__introduction/setup-options","source":"introduction/limitations","target":"introduction/setup-options"}},{"data":{"id":"introduction/limitations__appium-setup/prerequisites","source":"introduction/limitations","target":"appium-setup/prerequisites"}},{"data":{"id":"driver-ecosystem/overview__driver-ecosystem/how-drivers-work","source":"driver-ecosystem/overview","target":"driver-ecosystem/how-drivers-work"}},{"data":{"id":"driver-ecosystem/overview__driver-ecosystem/drivers","source":"driver-ecosystem/overview","target":"driver-ecosystem/drivers"}},{"data":{"id":"driver-ecosystem/overview__introduction/supported-languages","source":"driver-ecosystem/overview","target":"introduction/supported-languages"}},{"data":{"id":"driver-ecosystem/how-drivers-work__introduction/setup-options","source":"driver-ecosystem/how-drivers-work","target":"introduction/setup-options"}},{"data":{"id":"driver-ecosystem/how-drivers-work__introduction/architecture","source":"driver-ecosystem/how-drivers-work","target":"introduction/architecture"}},{"data":{"id":"driver-ecosystem/drivers__driver-ecosystem/uiautomator2-vs-espresso","source":"driver-ecosystem/drivers","target":"driver-ecosystem/uiautomator2-vs-espresso"}},{"data":{"id":"driver-ecosystem/uiautomator2-vs-espresso__introduction/tool-comparison","source":"driver-ecosystem/uiautomator2-vs-espresso","target":"introduction/tool-comparison"}},{"data":{"id":"appium-setup/windows/install-nodejs__appium-setup/prerequisites","source":"appium-setup/windows/install-nodejs","target":"appium-setup/prerequisites"}}],"bodies":{"introduction/what-is-appium":"\nAppium is an open-source automation framework for testing mobile applications and mobile web experiences. It can automate native, hybrid, and mobile web applications through standard WebDriver client libraries.\n\nAppium is cross-platform. A test team can use the same WebDriver-based API across supported platforms, while the platform-specific driver and automation engine handle the details for the target device or emulator. Supported targets can include Android, iOS, and Windows automation scenarios, depending on the installed driver and environment.\n\n![Appium cross-platform automation](/assets/images/appium-cross-platform.svg)\n\nAppium supports multiple programming languages because its clients expose the WebDriver API in language-specific libraries. Common choices include Java, JavaScript, Python, C#, PHP, and Ruby. See [Supported languages](/introduction/supported-languages.md) for the full list of client libraries.\n\nFor a minimal Python session example, see [`assets/code/basic-session.py`](/assets/code/basic-session.py).\n","introduction/supported-languages":"\nAppium is built on Selenium, and Selenium already supports many programming languages. Appium inherits that same flexibility: every Appium client library sends the same underlying W3C WebDriver commands, so a team can pick the language that fits its existing stack without changing how Appium behaves on the server or driver side.\n\n![Appium supported client languages](/assets/images/appium-supported-languages.svg)\n\n| Language | Client library |\n| --- | --- |\n| Java | [java-client](https://github.com/appium/java-client) |\n| JavaScript | [webdriverio](https://webdriver.io/) (maintained outside the Appium GitHub org) |\n| Python | [python-client](https://github.com/appium/python-client) |\n| C# | [dotnet-client](https://github.com/appium/dotnet-client) |\n| PHP | [php-client](https://github.com/appium-boneyard/php-client) (community-maintained, in the appium-boneyard org) |\n| Ruby | [ruby_lib](https://github.com/appium/ruby_lib) (`appium_lib` gem) |\n\nSee the [client drivers ecosystem page](https://github.com/appium/appium/blob/master/packages/appium/docs/en/ecosystem/clients.md) in the appium/appium repo for the full, current list.\n","introduction/architecture":"\nAppium uses a client-server automation model:\n\n- A test script uses an Appium client library, such as the Java, Python, JavaScript, or C# client.\n- The Appium server receives WebDriver commands and manages the automation session.\n- A platform driver translates those commands for a specific platform and automation technology.\n- The device or emulator executes the resulting actions and returns state, element, or error information.\n\nUnderneath this model, the Appium server is a Node.js HTTP server that exposes a REST API, so it listens for HTTP requests the same way any other web server does. An automation framework integrates the matching client library as a regular dependency — for example, a Maven or Gradle dependency for the Java client, an npm package for the JavaScript client, or a pip package for the Python client. Each client library's job is to convert that language's commands into the matching HTTP request and send it to the server; for example, the Java client turns a Java command into an HTTP POST request. When a client creates a new session, the server returns a session ID, and the client includes that same session ID on every following request so the server knows which session it belongs to.\n\n![Java client request flow through the Appium server](/assets/images/appium-java-client-flow.svg)\n\nAppium's client-server API is based on the Selenium WebDriver API, and the protocol history of the two projects tracks together. Selenium 3.x supported both the JSON Wire Protocol and the W3C WebDriver protocol; Selenium 4.x removed the JSON Wire Protocol completely and uses W3C WebDriver only, and all major browsers (Chrome, Firefox, and others) follow that same W3C standard. Because Appium is based on WebDriver, Appium 1.x likewise supported both protocols, and Appium 2.x switched to the W3C WebDriver protocol completely, matching Selenium 4.x. The W3C WebDriver protocol is based on the same client-server architecture described above; W3C means World Wide Web Consortium, the international community that develops standards for the web.\n\nSee Appium's own explainers for more detail: [How Does Appium Work?](https://github.com/appium/appium/blob/master/packages/appium/docs/en/intro/appium.md) and [Appium Project History](https://github.com/appium/appium/blob/master/packages/appium/docs/en/intro/history.md), both in the appium/appium repo.\n\n```mermaid\nflowchart LR\n    Test[Test script] --> Client[Appium client library]\n    Client -->|W3C WebDriver| Server[Appium server]\n    Server --> Driver[Platform driver]\n    Driver --> Engine[Automation engine]\n    Engine --> Target[Device or emulator]\n    Target --> Engine --> Driver --> Server --> Client\n```\n\n# Main components\n\n1. **Test script**: Defines the scenario, assertions, and user actions.\n2. **Appium client**: Provides language-specific APIs and sends WebDriver requests.\n3. **Appium server**: A Node.js HTTP server that creates sessions, routes commands, and coordinates drivers.\n4. **Platform driver**: Connects Appium to a target platform. Appium 2 drivers are installed and managed separately from the server.\n5. **Automation engine**: Uses the platform's automation technology to locate elements and perform actions.\n6. **Device or emulator**: Runs the application under test and reports results.\n\nA session begins when the client sends a set of desired capabilities, such as which platform (Android or iOS), which app, and other properties that define how the test should run. The server uses those capabilities to select a compatible driver, creates a session, and returns a session identifier. Subsequent commands use that session until the test ends it or the session is terminated. See the Desired capabilities and session configuration topic for the full set of options.\n\n# Platform drivers and native automation\n\nAppium reaches the native automation technology on each platform through a dedicated driver:\n\n- **Android**: Appium drives the session with the [UiAutomator2 driver](https://github.com/appium/appium-uiautomator2-driver), which talks to Android's UI Automator2 framework. As with other Appium 2 drivers, it is installed separately from the server. Android automation also relies on the [Appium Settings](https://github.com/appium/io.appium.settings) companion app and ADB commands for tasks the UI Automator2 framework does not cover on its own.\n- **iOS**: Appium drives the session with the [XCUITest driver](https://github.com/appium/appium-xcuitest-driver), which talks to Apple's XCTest native framework. On the device side, the XCUITest driver communicates through a [WebDriverAgent](https://github.com/appium/WebDriverAgent) server, which bridges WebDriver commands to XCTest calls.\n\nThe native framework performs the requested command on the application and returns a response back through the driver to the Appium server, which relays it to the client. WebDriverAgent and the Appium Settings app each get their own dedicated coverage in later topics. For how this driver mechanism generalizes to any platform, and the current catalog of official and community drivers, see [Appium ecosystem and drivers](/driver-ecosystem/index.md).\n\n```mermaid\nflowchart LR\n    Server[Appium server] --> AndroidDriver[UiAutomator2 driver]\n    AndroidDriver --> UIA2[UI Automator2 framework]\n    UIA2 --> AndroidDevice[Android device or emulator]\n\n    Server --> IOSDriver[XCUITest driver]\n    IOSDriver --> WDA[WebDriverAgent]\n    WDA --> XCTestFW[XCTest framework]\n    XCTestFW --> IOSDevice[iOS device or simulator]\n```\n","introduction/app-types":"\n![Native, hybrid, and mobile web apps compared](/assets/images/appium-app-types-comparison.svg)\n\n# Native apps\n\nNative apps are built for a particular mobile operating system using its platform SDK and UI components, developed separately per platform — for example, Java or Kotlin for Android and Swift for iOS. They generally expose native elements to Appium and are automated through platform-specific drivers.\n\nExamples include an Android app built with Kotlin and an iOS app built with Swift.\n\n- **Development cycle**: Longer, since the Android and iOS versions are built and maintained as separate codebases.\n- **Speed**: Fast, because the app uses the platform SDK's own native components directly — including things like the native keyboard, date pickers, permission dialogs, and other apps such as the camera.\n- **User experience**: Rich, with fast screen transitions and full access to native UI components.\n- **Automating with Appium**: Easiest to automate — UI elements are identified natively, no driver context switching is required, and elements are straightforward to inspect with the Appium Inspector.\n\n# Hybrid apps\n\nHybrid apps combine native application screens with embedded web content, commonly displayed in a WebView — a native container that renders standard web content (HTML, JavaScript, and CSS) using the platform's browser engine. Because that WebView content is platform-agnostic, it can be built once and reused across platforms. Tests may need to switch between a native context and a web context during the same session.\n\n- **Development cycle**: Shorter than a fully native app, depending on how much of the UI is WebView content, since that content is built once and reused across platforms.\n- **Speed**: Comparatively slower, since the WebView content (HTML, CSS, JavaScript) has to load like a web page.\n- **User experience**: Comparatively poorer, since WebView content is not optimized to interact with native components.\n- **Automating with Appium**: Trickiest to automate — tests require driver context switching between the native and web contexts, and the Appium Inspector cannot inspect WebView elements directly (other mechanisms are covered in a later topic). On Android, the app must have debug mode enabled before its WebView elements can be inspected.\n\n# Mobile web apps\n\nMobile web apps run in a mobile browser rather than being installed as an app. Appium automates browser interactions through WebDriver, including navigation, web elements, and browser contexts. There are two common designs:\n\n- **Adaptive web apps**: built specifically for a mobile screen, deliberately exposing a reduced feature set compared to the full desktop site.\n- **Responsive web apps**: load the same full feature set as the desktop site, with a layout that adjusts to fit the screen size.\n\n- **Development cycle**: Shorter, since the same web application serves desktop and mobile with only responsive or adaptive design changes.\n- **Speed**: Comparatively slower, since browser elements take time to load.\n- **User experience**: Comparatively poorer, since the site is not optimized specifically for a mobile screen.\n- **Automating with Appium**: Easy to automate — no driver context switching is required, so it is essentially the same as automating the desktop site, and the same element locators generally carry over. Elements are also easy to inspect using a desktop browser's own inspector.\n","introduction/advantages":"\n- **Cross-platform API**: The WebDriver API provides a common programming model across supported platforms.\n- **Multiple language clients**: Teams can choose a language such as Java, JavaScript, Python, C#, PHP, or Ruby.\n- **Real and virtual devices**: Appium can automate physical devices, Android emulators, and iOS simulators.\n- **Testing the actual application**: Tests generally do not require the application to be recompiled or modified specifically for automation.\n- **Broad functional testing fit**: Appium is well suited to end-to-end and functional testing across mobile platforms. Platform-native unit tests are usually a better fit for testing individual application units.\n- **Open-source ecosystem**: Appium has an active community and an ecosystem of platform drivers and client libraries.\n- **Backed by Sauce Labs**: Appium's development and support is backed by Sauce Labs, one of the most widely used cloud device testing platforms, which adds credibility to the tool. Cloud providers such as Sauce Labs and Perfecto Mobile support Appium as a mobile automation framework rather than competing with it.\n","introduction/tool-comparison":"\nAppium is often compared with other open-source tools that target one platform or one testing layer (cloud service providers like Sauce Labs and Perfecto Mobile are not included here, since they support Appium rather than compete with it):\n\n![Appium compared with platform-specific tools](/assets/images/appium-tool-comparison.svg)\n\n| Tool | Platform focus | Language support | Typical strength |\n| --- | --- | --- | --- |\n| Appium | Android, iOS, and supported additional targets | Java, JavaScript, Python, C#, PHP, Ruby | Cross-platform functional testing |\n| XCTest | iOS | Objective-C, Swift | Native iOS unit and UI testing |\n| Robotium | Android | Java | Android functional testing |\n| UI Automator | Android | Java, Kotlin | Android UI and device interaction |\n| Espresso | Android | Java, Kotlin | Fast, close-to-application Android UI testing |\n\nAppium is the clear winner on platform support (both Android and iOS) and on programming language support, since the other tools are each tied to a single platform and a narrower set of languages. For unit testing, Appium is comparatively slower and less suitable; XCTest and Espresso are better suited there because of their tight, fast integration with the application code. For functional testing, Appium is the strongest overall choice because it covers both platforms, while XCTest, Robotium, and UI Automator can each handle functional testing but only within their single supported platform.\n\nFor a closer look at UI Automator versus Espresso specifically — and how that maps onto choosing between Appium's own UiAutomator2 and Espresso drivers — see [UiAutomator2 vs. Espresso](/driver-ecosystem/uiautomator2-vs-espresso.md).\n","introduction/setup-options":"\nThe machine running the Appium server (the host OS) determines which target platforms it can reach locally:\n\n![Ways to set up Appium: host OS versus target platform](/assets/images/appium-setup-options.svg)\n\n- **Appium on macOS**: Can automate both Android and iOS devices or simulators, since macOS is the only host that can run the Xcode tooling iOS automation depends on.\n- **Appium on Windows (or Linux)**: Can automate Android devices, but not iOS — there is no supported way to run the XCUITest driver's iOS automation without macOS and Xcode. See [Limitations and considerations](/introduction/limitations.md) for the underlying requirement.\n- **Cloud-hosted Appium**: A cloud device provider (see [Advantages of Appium](/introduction/advantages.md)) runs the Appium server on its own Mac infrastructure, so a team on Windows or Linux can still automate iOS devices without owning a Mac.\n\nIn short: local automation is Android-only unless the host machine is a Mac; the cloud path is the way most Windows- or Linux-based teams reach iOS. Before installing on either host OS, check [Appium setup prerequisites](/appium-setup/prerequisites.md).\n","introduction/limitations":"\n- **iOS environment requirements**: Local iOS automation requires macOS and the required Xcode tooling. See [Ways to set up Appium](/introduction/setup-options.md) for how this constrains a Windows or Linux Appium host.\n- **Infrastructure management**: A local Appium server lab is practical for a small setup, such as two or four devices connected to a single Mac or Windows machine. Scaling automation beyond that becomes a problem to manage locally; cloud device providers, where devices are managed separately and available on demand, reduce this infrastructure burden. Emulators and simulators in particular need a reasonably powerful host machine — see [Appium setup prerequisites](/appium-setup/prerequisites.md).\n- **Documentation depth**: Some Appium documentation and driver documentation can be technical, so teams should validate examples against the installed Appium and driver versions.\n- **Platform changes**: Changes in iOS, Xcode, Android, or a platform automation engine (such as XCTest) can potentially break Appium, though this is not frequent. Upgrade Appium, drivers, operating systems, and automation tooling together, and check the currently open issues on the [Appium GitHub issues page](https://github.com/appium/appium/issues) before and after upgrading.\n\n# Next Topic\n\nNext: [Appium ecosystem and drivers](/driver-ecosystem/index.md)\n","introduction/references":"\n- [W3C WebDriver specification](https://www.w3.org/TR/webdriver/)\n- [Appium documentation](https://appium.io/docs/en/latest/) (built from the [appium/appium docs source](https://github.com/appium/appium/tree/master/packages/appium/docs/en))\n- [Appium GitHub issues](https://github.com/appium/appium/issues)\n- [Appium GitHub organization](https://github.com/appium) — server, drivers, client libraries, and related tooling\n","driver-ecosystem/overview":"\nBeyond the core Appium server, the project maintains a wide ecosystem of officially- and community-supported software, grouped into four categories, per the [Appium Ecosystem](https://appium.io/docs/en/2.0/ecosystem/) documentation:\n\n- **Drivers**: link Appium to a target device or platform (Android, iOS, Windows, a browser, and more). See [How Appium drivers work](/driver-ecosystem/how-drivers-work.md) and the [Appium driver catalog](/driver-ecosystem/drivers.md).\n- **Clients**: link Appium to your automation code, one library per programming language. Covered in [Supported languages](/introduction/supported-languages.md).\n- **Plugins**: modify or extend Appium's functionality (for example, adding custom commands or altering how existing ones behave). Not yet covered in this bundle.\n- **Tools**: interact with Appium in other ways, such as the [Appium Inspector](https://github.com/appium/appium-inspector) for exploring an app's element tree. Not yet covered in this bundle.\n","driver-ecosystem/how-drivers-work":"\nA driver is Appium's answer to \"how do we support automation of multiple, unrelated platforms?\" [Ways to set up Appium](/introduction/setup-options.md) and the [platform-drivers section](/introduction/architecture.md) already cover UiAutomator2 and XCUITest concretely; this topic covers the general mechanism any driver uses, based on Appium's own [driver introduction](https://github.com/appium/appium/blob/master/packages/appium/docs/en/intro/drivers.md).\n\n# A driver is just WebDriver-shaped code\n\nAt the most basic level, an Appium driver is a Node.js class that extends `BaseDriver`, a class Appium provides that already encapsulates the entire WebDriver protocol. A driver only needs to implement the methods that correspond to the WebDriver commands it wants to support — for example, a method named `setUrl` handles the WebDriver \"Navigate To\" command. Appium's protocol-to-method-name mapping lives in `@appium/base-driver`'s `routes.js`.\n\nWhat a driver actually *does* inside that method is entirely up to its author, and depends on the target platform: a browser driver might set `window.location.href`, while a mobile driver might launch an app through a deep link. The WebDriver command name stays the same; the implementation underneath is platform-specific.\n\n# Mapping WebDriver to native automation\n\nThe real challenge for a driver author is not the WebDriver protocol itself (`BaseDriver` handles that), but mapping it onto whatever native automation technology the target platform actually offers — technologies that usually have their own proprietary APIs. The UiAutomator2 driver, for example, relies not just on Android's UiAutomator2 framework, but also on ADB and on functions only available through a helper app (see [Platform drivers and native automation](/introduction/architecture.md)).\n\n# Multi-level architecture\n\nThis mapping can require a fairly deep stack. The XCUITest framework Apple provides for iOS automation only runs in Objective-C or Swift, triggered through Xcode — there's no direct path from a Node.js method to an XCUITest API call. The XCUITest driver's authors solved this by splitting the driver into two halves: a Node.js half (the part Appium loads, which handles incoming WebDriver commands) and an Objective-C half that runs on the device and actually drives XCUITest. That Objective-C half is itself a WebDriver server, called [WebDriverAgent](https://github.com/appium/WebDriverAgent).\n\nFor an XCUITest session, the full chain of technologies in play looks like: your test code, the Appium client library, the network, the Appium server, the XCUITest driver, WebDriverAgent, Xcode, XCUITest, iOS, and macOS. It's a deep stack, and it's why debugging an iOS Appium test can mean tracing a failure through several independent layers.\n\n# Proxy mode\n\nBecause both halves of a driver like XCUITest speak WebDriver, Appium can take a shortcut called proxying: instead of writing code to handle a command, a driver can tell Appium to forward that command's request directly to another WebDriver server (such as WebDriverAgent) and pass its response straight back to the client. The driver itself never touches the command. This is also how the [Safari driver](https://github.com/appium/appium-safari-driver) works — it implements almost nothing itself, proxying instead to an underlying SafariDriver process.\n\nProxying matters when debugging: if a driver's own source code has no implementation for a failing command, the command is likely being proxied elsewhere, and that's where the actual behavior needs to be traced.\n","driver-ecosystem/drivers":"\nEvery driver is installed with `appium driver install <name>` (or `--source=npm <package>` for a driver not in Appium's official driver list). Full, current listing: [Appium Drivers](https://github.com/appium/appium/blob/master/packages/appium/docs/en/ecosystem/drivers.md) in the appium/appium repo.\n\n# Official drivers\n\nMaintained by the Appium team:\n\n| Driver | Target | Mode(s) | Install |\n| --- | --- | --- | --- |\n| [Chromium](https://github.com/appium/appium-chromium-driver) | Desktop and mobile Chromium browsers (Chrome, Edge) | Web | `appium driver install chromium` |\n| [Espresso](https://github.com/appium/appium-espresso-driver) | Android applications | Native | `appium driver install espresso` |\n| [Gecko](https://github.com/appium/appium-geckodriver) | Desktop and mobile Gecko browsers (Firefox) | Web | `appium driver install gecko` |\n| [Mac2](https://github.com/appium/appium-mac2-driver) | macOS applications | Native | `appium driver install mac2` |\n| [Safari](https://github.com/appium/appium-safari-driver) | Desktop and mobile Safari | Web | `appium driver install safari` |\n| [UiAutomator2](https://github.com/appium/appium-uiautomator2-driver) | Android, Android TV, Android Wear | Native, Hybrid, Web | `appium driver install uiautomator2` |\n| [Windows](https://github.com/appium/appium-windows-driver) | Windows applications | Native | `appium driver install windows` |\n| [XCUITest](https://appium.github.io/appium-xcuitest-driver/) | iOS, iPadOS, tvOS | Native, Hybrid, Web | `appium driver install xcuitest` |\n\nThe Windows driver's Node.js part is Appium-maintained, but its server part (Microsoft's WinAppDriver executable) has not been updated since 2022.\n\nChoosing between the two Android drivers (UiAutomator2 and Espresso) depends on what you're automating: see [UiAutomator2 vs. Espresso](/driver-ecosystem/uiautomator2-vs-espresso.md).\n\n# Other (community-maintained) drivers\n\nNot maintained by the Appium team, but usable for platforms Appium's official drivers don't reach:\n\n| Driver | Target | Mode | Maintained by |\n| --- | --- | --- | --- |\n| [Flutter](https://github.com/appium/appium-flutter-driver) | iOS/Android apps built with Flutter | Native | Appium team / community |\n| [Flutter Integration](https://github.com/AppiumTestDistribution/appium-flutter-integration-driver) | iOS/Android apps built with Flutter | Native | Community (`@AppiumTestDistribution`) |\n| [LG WebOS](https://github.com/headspinio/appium-lg-webos-driver) | LG TV web applications | Web | HeadSpin |\n| [Linux (`@Itsmeaj`)](https://github.com/Itsmeaj/appium) | Linux desktop applications (X11, Wayland) | Native | Community (`@Itsmeaj`) |\n| [NovaWindows](https://github.com/AutomateThePlanet/appium-novawindows-driver) | Windows applications; a drop-in replacement for the official Windows driver | Native | Community / Automate The Planet |\n| [Roku](https://github.com/headspinio/appium-roku-driver) | Roku channels | Native | HeadSpin |\n| [TizenTV](https://github.com/headspinio/appium-tizen-tv-driver) | Tizen TV web applications | Web | HeadSpin |\n\nA few other community drivers exist for Linux, Tizen, and You.i Engine, but per the upstream catalog have not been maintained since 2020–2022 and target Appium 1 or require a custom install; check the [full catalog](https://github.com/appium/appium/blob/master/packages/appium/docs/en/ecosystem/drivers.md) before relying on one of these.\n","driver-ecosystem/uiautomator2-vs-espresso":"\nAppium's two official Android drivers each wrap a different Google testing framework: the [UiAutomator2 driver](https://github.com/appium/appium-uiautomator2-driver) wraps [UiAutomator](https://developer.android.com/training/testing/ui-automator), and the [Espresso driver](https://github.com/appium/appium-espresso-driver) wraps [Espresso](https://developer.android.com/training/testing/espresso). The two underlying frameworks take different approaches, which carries through to the driver built on top of each:\n\n| Aspect | UiAutomator2 | Espresso |\n| --- | --- | --- |\n| Underlying framework | [UiAutomator](https://developer.android.com/training/testing/ui-automator) | [Espresso](https://developer.android.com/training/testing/espresso) |\n| Speed | Slow | Fast |\n| Synchronization | Tests need to be synchronized manually | Supports auto synchronization |\n| Access to the app | Black box | Has access to the internals of the app |\n| Off-screen elements | Cannot find elements not rendered on the screen | Can find elements not rendered on the screen |\n| Android View Tag | Cannot be used to find a UI element | Can be used to find a UI element |\n| App knowledge required | Understanding of the app's implementation details is not needed | Understanding of the codebase is needed |\n| Best suited for | Automating UI functional tests | Automating unit tests |\n| Scope | Can test multiple apps and interact with the system | Can test only one app |\n| Jetpack Compose | No official support yet | Supported |\n| Learning curve | Easy to start with | Can be long |\n\nBecause UiAutomator2 treats the app as a black box with no code-level access, it fits Appium's usual role: black-box, cross-app functional testing where the tester doesn't need (or have) access to the app's source. Espresso's speed and internal access make it better suited to fast, in-process unit-style testing of a single app whose codebase the tester already understands — closer to what [Appium compared with platform-specific tools](/introduction/tool-comparison.md) already says about Espresso being the faster, close-to-application choice.\n","appium-setup/prerequisites":"\nGetting these prerequisites right before installing anything is worth the extra few minutes: skipping them is a common way to lose a week or more chasing setup problems that have nothing to do with Appium itself.\n\n# Baseline technical requirements\n\nThe Appium server itself needs, per the [System Requirements](https://github.com/appium/appium/blob/master/packages/appium/docs/en/quickstart/requirements.md) documentation:\n\n- A macOS, Linux, or Windows operating system.\n- [Node.js](https://nodejs.org), in the version range Appium's current release supports (check the [Appium documentation](https://appium.github.io/appium/docs/en/2.0/) for the exact range) — an LTS release is recommended.\n- [npm](https://npmjs.com) (bundled with Node.js, but upgradable independently).\n\nAppium itself is lightweight; it has no significant disk or RAM requirements on its own. Each driver, though, typically needs the full developer toolchain and SDK for its target platform (see [Appium ecosystem and drivers](/driver-ecosystem/index.md)). Every official driver ships with the Appium Doctor tool, which checks whether its specific requirements are satisfied — run it before assuming a failed session is Appium's fault.\n\n# Administrator access\n\nBe an administrator on the Windows or Mac machine you're setting up. Without admin rights, you may not be able to install Appium or the software it depends on (Node.js, Android SDK tools, Xcode, and so on).\n\n# Use a current OS version\n\nUse a current, supported version of Windows or macOS. Older, unsupported OS versions are more likely to hit compatibility issues with current Node.js, Android SDK, or Xcode releases.\n\n# Office machines: antivirus and company policy\n\nA personal machine is the easiest place to practice Appium. On an office machine, two things commonly block a setup that would otherwise work fine:\n\n- **Antivirus software** flagging or quarantining Appium or one of its dependencies.\n- **Company policy** restricting downloads from the internet, or blocking software installation (including Node.js) outright.\n\nIf either applies, this isn't something to troubleshoot alone — work with the admin or security team responsible for those policies, and make sure your account has admin privileges on the machine itself.\n\n# Emulators, simulators, and real devices\n\nAndroid emulators (and iOS simulators) are resource-hungry: they need a reasonably powerful processor and sufficient RAM to run without becoming a source of constant, unrelated test flakiness. Don't try to run them on an old, underpowered laptop — the frustration is rarely worth it.\n\nIf you have access to a real Android or iOS device, prefer it: a real device sits outside the host machine, so it doesn't compete with it for processing power or RAM the way an emulator or simulator does.\n\n# Device-specific restrictions\n\nSome Android OEMs ship custom security restrictions on top of stock Android that can block Appium's automation commands outright, independent of anything in your Appium setup. For example, in a [Realme 3 Pro issue on the Appium GitHub](https://github.com/appium/appium/issues/13802), an Appium maintainer's diagnosis was direct: the device has vendor-added security limitations, and the practical options are to use a different device for automation or contact the vendor about relaxing those restrictions. That issue's comment thread is worth reading in full — several people worked around it by enabling specific developer-options settings (for example, disabling \"permission monitoring\"), though the fix isn't guaranteed to be the same on every device or OS version.\n\n# When you hit an environment issue\n\nBefore assuming a problem is unique to you, search the [Appium GitHub issues page](https://github.com/appium/appium/issues) for it. You'll usually find either a solution, or confirmation that it's a known limitation you'll need to work around (as with the device-specific restrictions above).\n","appium-setup/windows/install-nodejs":"\nAppium's server is installed and launched from the command line — on Windows, from Command Prompt. Before installing Appium itself, Node.js and npm need to be in place: Appium's server is a Node.js application, and npm (the Node Package Manager) is what installs Node.js-based software, Appium included. See [Appium setup prerequisites](/appium-setup/prerequisites.md) for the environment checks to do before this step.\n\n# Check for an existing install\n\nOpen Command Prompt and run:\n\n```sh\nnode -v\nnpm -v\n```\n\nIf either command isn't recognized, Node.js — which bundles npm — isn't installed yet.\n\n# Download Node.js\n\nGo to [nodejs.org](https://nodejs.org) and download the **LTS** (Long Term Support) build for Windows, rather than the Current release — LTS is more stable. The Node.js installer bundles npm, so there's no separate npm install step.\n\n# Run the installer\n\n1. Launch the downloaded installer and select **Next**.\n2. Accept the license terms and select **Next**.\n3. Keep the default installation location and select **Next**. The installer confirms it will install both the Node.js runtime and the npm package manager.\n\nWith Node.js and npm installed, the next step is installing the Appium server itself with npm.\n"},"types":["Reference","Topic"],"palette":{"Topic":"#1e5d52","Reference":"#9a6a2f"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
