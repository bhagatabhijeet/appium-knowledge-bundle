<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }

.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;

}

  flex: 0 0 40%;

  background: #fff;
}

  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }

}

  padding: 2px 8px;
  border-radius: 10px;

}
dl.frontmatter {

  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;

}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;

}

  padding: 10px 12px;
  border-radius: 6px;

  font-size: 12px;

#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {

:"","sources":[],"trust_tier":"unverified","stale":false,"color":"#1e5d52","size":44}}],"edges":[{"data":{"id":"introduction/what-is-appium__introduction/supported-languages","source":"introduction/what-is-appium","target":"introduction/supported-languages"}},{"data":{"id":"introduction/tool-comparison__driver-ecosystem/uiautomator2-vs-espresso","source":"introduction/tool-comparison","target":"driver-ecosystem/uiautomator2-vs-espresso"}},{"data":{"id":"introduction/setup-options__introduction/limitations","source":"introduction/setup-options","target":"introduction/limitations"}},{"data":{"id":"introduction/setup-options__introduction/advantages","source":"introduction/setup-options","target":"introduction/advantages"}},{"data":{"id":"introduction/setup-options__appium-setup/prerequisites","source":"introduction/setup-options","target":"appium-setup/prerequisites"}},{"data":{"id":"introduction/limitations__introduction/setup-options","source":"introduction/limitations","target":"introduction/setup-options"}},{"data":{"id":"introduction/limitations__appium-setup/prerequisites","source":"introduction/limitations","target":"appium-setup/prerequisites"}},{"data":{"id":"driver-ecosystem/overview__driver-ecosystem/how-drivers-work","source":"driver-ecosystem/overview","target":"driver-ecosystem/how-drivers-work"}},{"data":{"id":"driver-ecosystem/overview__driver-ecosystem/drivers","source":"driver-ecosystem/overview","target":"driver-ecosystem/drivers"}},{"data":{"id":"driver-ecosystem/overview__introduction/supported-languages","source":"driver-ecosystem/overview","target":"introduction/supported-languages"}},{"data":{"id":"driver-ecosystem/how-drivers-work__introduction/setup-options","source":"driver-ecosystem/how-drivers-work","target":"introduction/setup-options"}},{"data":{"id":"driver-ecosystem/how-drivers-work__introduction/architecture","source":"driver-ecosystem/how-drivers-work","target":"introduction/architecture"}},{"data":{"id":"driver-ecosystem/drivers__driver-ecosystem/uiautomator2-vs-espresso","source":"driver-ecosystem/drivers","target":"driver-ecosystem/uiautomator2-vs-espresso"}},{"data":{"id":"driver-ecosystem/uiautomator2-vs-espresso__introduction/tool-comparison","source":"driver-ecosystem/uiautomator2-vs-espresso","target":"introduction/tool-comparison"}},{"data":{"id":"appium-setup/windows/install-nodejs__appium-setup/prerequisites","source":"appium-setup/windows/install-nodejs","target":"appium-setup/prerequisites"}},{"data":{"id":"appium-setup/windows/install-appium-server__appium-setup/windows/install-nodejs","source":"appium-setup/windows/install-appium-server","target":"appium-setup/windows/install-nodejs"}},{"data":{"id":"appium-setup/windows/setup-android-sdk__appium-setup/windows/install-appium-server","source":"appium-setup/windows/setup-android-sdk","target":"appium-setup/windows/install-appium-server"}},{"data":{"id":"appium-setup/windows/setup-android-sdk__appium-setup/windows/setup-real-device","source":"appium-setup/windows/setup-android-sdk","target":"appium-setup/windows/setup-real-device"}},{"data":{"id":"appium-setup/windows/setup-android-sdk__appium-setup/windows/install-appium-inspector","source":"appium-setup/windows/setup-android-sdk","target":"appium-setup/windows/install-appium-inspector"}},{"data":{"id":"appium-setup/windows/install-appium-inspector__appium-setup/windows/install-appium-server","source":"appium-setup/windows/install-appium-inspector","target":"appium-setup/windows/install-appium-server"}},{"data":{"id":"appium-setup/windows/setup-real-device__appium-setup/windows/install-appium-inspector","source":"appium-setup/windows/setup-real-device","target":"appium-setup/windows/install-appium-inspector"}}],"bodies":{"introduction/what-is-appium":"\nAppium is an open-source automation framework for testing mobile applications and mobile web experiences. It can automate native, hybrid, and mobile web applications through standard WebDriver client libraries.\n\nAppium is cross-platform. A test team can use the same WebDriver-based API across supported platforms, while the platform-specific driver and automation engine handle the details for the target device or emulator. Supported targets can include Android, iOS, and Windows automation scenarios, depending on the installed driver and environment.\n\n![Appium cross-platform automation](/assets/images/appium-cross-platform.svg)\n\nAppium supports multiple programming languages because its clients expose the WebDriver API in language-specific libraries. Common choices include Java, JavaScript, Python, C#, PHP, and Ruby. See [Supported languages](/introduction/supported-languages.md) for the full list of client libraries.\n\nFor a minimal Python session example, see [`assets/code/basic-session.py`](/assets/code/basic-session.py).\n","introduction/supported-languages":"\nAppium is built on Selenium, and Selenium already supports many programming languages. Appium inherits that same flexibility: every Appium client library sends the same underlying W3C WebDriver commands, so a team can pick the language that fits its existing stack without changing how Appium behaves on the server or driver side.\n\n![Appium supported client languages](/assets/images/appium-supported-languages.svg)\n\n| Language | Client library |\n| --- | --- |\n| Java | [java-client](https://github.com/appium/java-client) |\n| JavaScript | [webdriverio](https://webdriver.io/) (maintained outside the Appium GitHub org) |\n| Python | [python-client](https://github.com/appium/python-client) |\n| C# | [dotnet-client](https://github.com/appium/dotnet-client) |\n| PHP | [php-client](https://github.com/appium-boneyard/php-client) (community-maintained, in the appium-boneyard org) |\n| Ruby | [ruby_lib](https://github.com/appium/ruby_lib) (`appium_lib` gem) |\n\nSee the [client drivers ecosystem page](https://github.com/appium/appium/blob/master/packages/appium/docs/en/ecosystem/clients.md) in the appium/appium repo for the full, current list.\n","introduction/architecture":"\nAppium uses a client-server automation model:\n\n- A test script uses an Appium client library, such as the Java, Python, JavaScript, or C# client.\n- The Appium server receives WebDriver commands and manages the automation session.\n- A platform driver translates those commands for a specific platform and automation technology.\n- The device or emulator executes the resulting actions and returns state, element, or error information.\n\nUnderneath this model, the Appium server is a Node.js HTTP server that exposes a REST API, so it listens for HTTP requests the same way any other web server does. An automation framework integrates the matching client library as a regular dependency — for example, a Maven or Gradle dependency for the Java client, an npm package for the JavaScript client, or a pip package for the Python client. Each client library's job is to convert that language's commands into the matching HTTP request and send it to the server; for example, the Java client turns a Java command into an HTTP POST request. When a client creates a new session, the server returns a session ID, and the client includes that same session ID on every following request so the server knows which session it belongs to.\n\n![Java client request flow through the Appium server](/assets/images/appium-java-client-flow.svg)\n\nAppium's client-server API is based on the Selenium WebDriver API, and the protocol history of the two projects tracks together. Selenium 3.x supported both the JSON Wire Protocol and the W3C WebDriver protocol; Selenium 4.x removed the JSON Wire Protocol completely and uses W3C WebDriver only, and all major browsers (Chrome, Firefox, and others) follow that same W3C standard. Because Appium is based on WebDriver, Appium 1.x likewise supported both protocols, and Appium 2.x switched to the W3C WebDriver protocol completely, matching Selenium 4.x. The W3C WebDriver protocol is based on the same client-server architecture described above; W3C means World Wide Web Consortium, the international community that develops standards for the web.\n\nSee Appium's own explainers for more detail: [How Does Appium Work?](https://github.com/appium/appium/blob/master/packages/appium/docs/en/intro/appium.md) and [Appium Project History](https://github.com/appium/appium/blob/master/packages/appium/docs/en/intro/history.md), both in the appium/appium repo.\n\n```mermaid\nflowchart LR\n    Test[Test script] --> Client[Appium client library]\n    Client -->|W3C WebDriver| Server[Appium server]\n    Server --> Driver[Platform driver]\n    Driver --> Engine[Automation engine]\n    Engine --> Target[Device or emulator]\n    Target --> Engine --> Driver --> Server --> Client\n```\n\n# Main components\n\n1. **Test script**: Defines the scenario, assertions, and user actions.\n2. **Appium client**: Provides language-specific APIs and sends WebDriver requests.\n3. **Appium server**: A Node.js HTTP server that creates sessions, routes commands, and coordinates drivers.\n4. **Platform driver**: Connects Appium to a target platform. Appium 2 drivers are installed and managed separately from the server.\n5. **Automation engine**: Uses the platform's automation technology to locate elements and perform actions.\n6. **Device or emulator**: Runs the application under test and reports results.\n\nA session begins when the client sends a set of desired capabilities, such as which platform (Android or iOS), which app, and other properties that define how the test should run. The server uses those capabilities to select a compatible driver, creates a session, and returns a session identifier. Subsequent commands use that session until the test ends it or the session is terminated. See the Desired capabilities and session configuration topic for the full set of options.\n\n# Platform drivers and native automation\n\nAppium reaches the native automation technology on each platform through a dedicated driver:\n\n- **Android**: Appium drives the session with the [UiAutomator2 driver](https://github.com/appium/appium-uiautomator2-driver), which talks to Android's UI Automator2 framework. As with other Appium 2 drivers, it is installed separately from the server. Android automation also relies on the [Appium Settings](https://github.com/appium/io.appium.settings) companion app and ADB commands for tasks the UI Automator2 framework does not cover on its own.\n- **iOS**: Appium drives the session with the [XCUITest driver](https://github.com/appium/appium-xcuitest-driver), which talks to Apple's XCTest native framework. On the device side, the XCUITest driver communicates through a [WebDriverAgent](https://github.com/appium/WebDriverAgent) server, which bridges WebDriver commands to XCTest calls.\n\nThe native framework performs the requested command on the application and returns a response back through the driver to the Appium server, which relays it to the client. WebDriverAgent and the Appium Settings app each get their own dedicated coverage in later topics. For how this driver mechanism generalizes to any platform, and the current catalog of official and community drivers, see [Appium ecosystem and drivers](/driver-ecosystem/index.md).\n\n```mermaid\nflowchart LR\n    Server[Appium server] --> AndroidDriver[UiAutomator2 driver]\n    AndroidDriver --> UIA2[UI Automator2 framework]\n    UIA2 --> AndroidDevice[Android device or emulator]\n\n    Server --> IOSDriver[XCUITest driver]\n    IOSDriver --> WDA[WebDriverAgent]\n    WDA --> XCTestFW[XCTest framework]\n    XCTestFW --> IOSDevice[iOS device or simulator]\n```\n","introduction/app-types":"\n![Native, hybrid, and mobile web apps compared](/assets/images/appium-app-types-comparison.svg)\n\n# Native apps\n\nNative apps are built for a particular mobile operating system using its platform SDK and UI components, developed separately per platform — for example, Java or Kotlin for Android and Swift for iOS. They generally expose native elements to Appium and are automated through platform-specific drivers.\n\nExamples include an Android app built with Kotlin and an iOS app built with Swift.\n\n- **Development cycle**: Longer, since the Android and iOS versions are built and maintained as separate codebases.\n- **Speed**: Fast, because the app uses the platform SDK's own native components directly — including things like the native keyboard, date pickers, permission dialogs, and other apps such as the camera.\n- **User experience**: Rich, with fast screen transitions and full access to native UI components.\n- **Automating with Appium**: Easiest to automate — UI elements are identified natively, no driver context switching is required, and elements are straightforward to inspect with the Appium Inspector.\n\n# Hybrid apps\n\nHybrid apps combine native application screens with embedded web content, commonly displayed in a WebView — a native container that renders standard web content (HTML, JavaScript, and CSS) using the platform's browser engine. Because that WebView content is platform-agnostic, it can be built once and reused across platforms. Tests may need to switch between a native context and a web context during the same session.\n\n- **Development cycle**: Shorter than a fully native app, depending on how much of the UI is WebView content, since that content is built once and reused across platforms.\n- **Speed**: Comparatively slower, since the WebView content (HTML, CSS, JavaScript) has to load like a web page.\n- **User experience**: Comparatively poorer, since WebView content is not optimized to interact with native components.\n- **Automating with Appium**: Trickiest to automate — tests require driver context switching between the native and web contexts, and the Appium Inspector cannot inspect WebView elements directly (other mechanisms are covered in a later topic). On Android, the app must have debug mode enabled before its WebView elements can be inspected.\n\n# Mobile web apps\n\nMobile web apps run in a mobile browser rather than being installed as an app. Appium automates browser interactions through WebDriver, including navigation, web elements, and browser contexts. There are two common designs:\n\n- **Adaptive web apps**: built specifically for a mobile screen, deliberately exposing a reduced feature set compared to the full desktop site.\n- **Responsive web apps**: load the same full feature set as the desktop site, with a layout that adjusts to fit the screen size.\n\n- **Development cycle**: Shorter, since the same web application serves desktop and mobile with only responsive or adaptive design changes.\n- **Speed**: Comparatively slower, since browser elements take time to load.\n- **User experience**: Comparatively poorer, since the site is not optimized specifically for a mobile screen.\n- **Automating with Appium**: Easy to automate — no driver context switching is required, so it is essentially the same as automating the desktop site, and the same element locators generally carry over. Elements are also easy to inspect using a desktop browser's own inspector.\n","introduction/advantages":"\n- **Cross-platform API**: The WebDriver API provides a common programming model across supported platforms.\n- **Multiple language clients**: Teams can choose a language such as Java, JavaScript, Python, C#, PHP, or Ruby.\n- **Real and virtual devices**: Appium can automate physical devices, Android emulators, and iOS simulators.\n- **Testing the actual application**: Tests generally do not require the application to be recompiled or modified specifically for automation.\n- **Broad functional testing fit**: Appium is well suited to end-to-end and functional testing across mobile platforms. Platform-native unit tests are usually a better fit for testing individual application units.\n- **Open-source ecosystem**: Appium has an active community and an ecosystem of platform drivers and client libraries.\n- **Backed by Sauce Labs**: Appium's development and support is backed by Sauce Labs, one of the most widely used cloud device testing platforms, which adds credibility to the tool. Cloud providers such as Sauce Labs and Perfecto Mobile support Appium as a mobile automation framework rather than competing with it.\n","introduction/tool-comparison":"\nAppium is often compared with other open-source tools that target one platform or one testing layer (cloud service providers like Sauce Labs and Perfecto Mobile are not included here, since they support Appium rather than compete with it):\n\n![Appium compared with platform-specific tools](/assets/images/appium-tool-comparison.svg)\n\n| Tool | Platform focus | Language support | Typical strength |\n| --- | --- | --- | --- |\n| Appium | Android, iOS, and supported additional targets | Java, JavaScript, Python, C#, PHP, Ruby | Cross-platform functional testing |\n| XCTest | iOS | Objective-C, Swift | Native iOS unit and UI testing |\n| Robotium | Android | Java | Android functional testing |\n| UI Automator | Android | Java, Kotlin | Android UI and device interaction |\n| Espresso | Android | Java, Kotlin | Fast, close-to-application Android UI testing |\n\nAppium is the clear winner on platform support (both Android and iOS) and on programming language support, since the other tools are each tied to a single platform and a narrower set of languages. For unit testing, Appium is comparatively slower and less suitable; XCTest and Espresso are better suited there because of their tight, fast integration with the application code. For functional testing, Appium is the strongest overall choice because it covers both platforms, while XCTest, Robotium, and UI Automator can each handle functional testing but only within their single supported platform.\n\nFor a closer look at UI Automator versus Espresso specifically — and how that maps onto choosing between Appium's own UiAutomator2 and Espresso drivers — see [UiAutomator2 vs. Espresso](/driver-ecosystem/uiautomator2-vs-espresso.md).\n","introduction/setup-options":"\nThe machine running the Appium server (the host OS) determines which target platforms it can reach locally:\n\n![Ways to set up Appium: host OS versus target platform](/assets/images/appium-setup-options.svg)\n\n- **Appium on macOS**: Can automate both Android and iOS devices or simulators, since macOS is the only host that can run the Xcode tooling iOS automation depends on.\n- **Appium on Windows (or Linux)**: Can automate Android devices, but not iOS — there is no supported way to run the XCUITest driver's iOS automation without macOS and Xcode. See [Limitations and considerations](/introduction/limitations.md) for the underlying requirement.\n- **Cloud-hosted Appium**: A cloud device provider (see [Advantages of Appium](/introduction/advantages.md)) runs the Appium server on its own Mac infrastructure, so a team on Windows or Linux can still automate iOS devices without owning a Mac.\n\nIn short: local automation is Android-only unless the host machine is a Mac; the cloud path is the way most Windows- or Linux-based teams reach iOS. Before installing on either host OS, check [Appium setup prerequisites](/appium-setup/prerequisites.md).\n","introduction/limitations":"\n- **iOS environment requirements**: Local iOS automation requires macOS and the required Xcode tooling. See [Ways to set up Appium](/introduction/setup-options.md) for how this constrains a Windows or Linux Appium host.\n- **Infrastructure management**: A local Appium server lab is practical for a small setup, such as two or four devices connected to a single Mac or Windows machine. Scaling automation beyond that becomes a problem to manage locally; cloud device providers, where devices are managed separately and available on demand, reduce this infrastructure burden. Emulators and simulators in particular need a reasonably powerful host machine — see [Appium setup prerequisites](/appium-setup/prerequisites.md).\n- **Documentation depth**: Some Appium documentation and driver documentation can be technical, so teams should validate examples against the installed Appium and driver versions.\n- **Platform changes**: Changes in iOS, Xcode, Android, or a platform automation engine (such as XCTest) can potentially break Appium, though this is not frequent. Upgrade Appium, drivers, operating systems, and automation tooling together, and check the currently open issues on the [Appium GitHub issues page](https://github.com/appium/appium/issues) before and after upgrading.\n\n# Next Topic\n\nNext: [Appium ecosystem and drivers](/driver-ecosystem/index.md)\n","introduction/references":"\n- [W3C WebDriver specification](https://www.w3.org/TR/webdriver/)\n- [Appium documentation](https://appium.io/docs/en/latest/) (built from the [appium/appium docs source](https://github.com/appium/appium/tree/master/packages/appium/docs/en))\n- [Appium GitHub issues](https://github.com/appium/appium/issues)\n- [Appium GitHub organization](https://github.com/appium) — server, drivers, client libraries, and related tooling\n","driver-ecosystem/overview":"\nBeyond the core Appium server, the project maintains a wide ecosystem of officially- and community-supported software, grouped into four categories, per the [Appium Ecosystem](https://appium.io/docs/en/2.0/ecosystem/) documentation:\n\n- **Drivers**: link Appium to a target device or platform (Android, iOS, Windows, a browser, and more). See [How Appium drivers work](/driver-ecosystem/how-drivers-work.md) and the [Appium driver catalog](/driver-ecosystem/drivers.md).\n- **Clients**: link Appium to your automation code, one library per programming language. Covered in [Supported languages](/introduction/supported-languages.md).\n- **Plugins**: modify or extend Appium's functionality (for example, adding custom commands or altering how existing ones behave). Not yet covered in this bundle.\n- **Tools**: interact with Appium in other ways, such as the [Appium Inspector](https://github.com/appium/appium-inspector) for exploring an app's element tree. Not yet covered in this bundle.\n","driver-ecosystem/how-drivers-work":"\nA driver is Appium's answer to \"how do we support automation of multiple, unrelated platforms?\" [Ways to set up Appium](/introduction/setup-options.md) and the [platform-drivers section](/introduction/architecture.md) already cover UiAutomator2 and XCUITest concretely; this topic covers the general mechanism any driver uses, based on Appium's own [driver introduction](https://github.com/appium/appium/blob/master/packages/appium/docs/en/intro/drivers.md).\n\n# A driver is just WebDriver-shaped code\n\nAt the most basic level, an Appium driver is a Node.js class that extends `BaseDriver`, a class Appium provides that already encapsulates the entire WebDriver protocol. A driver only needs to implement the methods that correspond to the WebDriver commands it wants to support — for example, a method named `setUrl` handles the WebDriver \"Navigate To\" command. Appium's protocol-to-method-name mapping lives in `@appium/base-driver`'s `routes.js`.\n\nWhat a driver actually *does* inside that method is entirely up to its author, and depends on the target platform: a browser driver might set `window.location.href`, while a mobile driver might launch an app through a deep link. The WebDriver command name stays the same; the implementation underneath is platform-specific.\n\n# Mapping WebDriver to native automation\n\nThe real challenge for a driver author is not the WebDriver protocol itself (`BaseDriver` handles that), but mapping it onto whatever native automation technology the target platform actually offers — technologies that usually have their own proprietary APIs. The UiAutomator2 driver, for example, relies not just on Android's UiAutomator2 framework, but also on ADB and on functions only available through a helper app (see [Platform drivers and native automation](/introduction/architecture.md)).\n\n# Multi-level architecture\n\nThis mapping can require a fairly deep stack. The XCUITest framework Apple provides for iOS automation only runs in Objective-C or Swift, triggered through Xcode — there's no direct path from a Node.js method to an XCUITest API call. The XCUITest driver's authors solved this by splitting the driver into two halves: a Node.js half (the part Appium loads, which handles incoming WebDriver commands) and an Objective-C half that runs on the device and actually drives XCUITest. That Objective-C half is itself a WebDriver server, called [WebDriverAgent](https://github.com/appium/WebDriverAgent).\n\nFor an XCUITest session, the full chain of technologies in play looks like: your test code, the Appium client library, the network, the Appium server, the XCUITest driver, WebDriverAgent, Xcode, XCUITest, iOS, and macOS. It's a deep stack, and it's why debugging an iOS Appium test can mean tracing a failure through several independent layers.\n\n# Proxy mode\n\nBecause both halves of a driver like XCUITest speak WebDriver, Appium can take a shortcut called proxying: instead of writing code to handle a command, a driver can tell Appium to forward that command's request directly to another WebDriver server (such as WebDriverAgent) and pass its response straight back to the client. The driver itself never touches the command. This is also how the [Safari driver](https://github.com/appium/appium-safari-driver) works — it implements almost nothing itself, proxying instead to an underlying SafariDriver process.\n\nProxying matters when debugging: if a driver's own source code has no implementation for a failing command, the command is likely being proxied elsewhere, and that's where the actual behavior needs to be traced.\n","driver-ecosystem/drivers":"\nEvery driver is installed with `appium driver install <name>` (or `--source=npm <package>` for a driver not in Appium's official driver list). Full, current listing: [Appium Drivers](https://github.com/appium/appium/blob/master/packages/appium/docs/en/ecosystem/drivers.md) in the appium/appium repo.\n\n# Official drivers\n\nMaintained by the Appium team:\n\n| Driver | Target | Mode(s) | Install |\n| --- | --- | --- | --- |\n| [Chromium](https://github.com/appium/appium-chromium-driver) | Desktop and mobile Chromium browsers (Chrome, Edge) | Web | `appium driver install chromium` |\n| [Espresso](https://github.com/appium/appium-espresso-driver) | Android applications | Native | `appium driver install espresso` |\n| [Gecko](https://github.com/appium/appium-geckodriver) | Desktop and mobile Gecko browsers (Firefox) | Web | `appium driver install gecko` |\n| [Mac2](https://github.com/appium/appium-mac2-driver) | macOS applications | Native | `appium driver install mac2` |\n| [Safari](https://github.com/appium/appium-safari-driver) | Desktop and mobile Safari | Web | `appium driver install safari` |\n| [UiAutomator2](https://github.com/appium/appium-uiautomator2-driver) | Android, Android TV, Android Wear | Native, Hybrid, Web | `appium driver install uiautomator2` |\n| [Windows](https://github.com/appium/appium-windows-driver) | Windows applications | Native | `appium driver install windows` |\n| [XCUITest](https://appium.github.io/appium-xcuitest-driver/) | iOS, iPadOS, tvOS | Native, Hybrid, Web | `appium driver install xcuitest` |\n\nThe Windows driver's Node.js part is Appium-maintained, but its server part (Microsoft's WinAppDriver executable) has not been updated since 2022.\n\nChoosing between the two Android drivers (UiAutomator2 and Espresso) depends on what you're automating: see [UiAutomator2 vs. Espresso](/driver-ecosystem/uiautomator2-vs-espresso.md).\n\n# Other (community-maintained) drivers\n\nNot maintained by the Appium team, but usable for platforms Appium's official drivers don't reach:\n\n| Driver | Target | Mode | Maintained by |\n| --- | --- | --- | --- |\n| [Flutter](https://github.com/appium/appium-flutter-driver) | iOS/Android apps built with Flutter | Native | Appium team / community |\n| [Flutter Integration](https://github.com/AppiumTestDistribution/appium-flutter-integration-driver) | iOS/Android apps built with Flutter | Native | Community (`@AppiumTestDistribution`) |\n| [LG WebOS](https://github.com/headspinio/appium-lg-webos-driver) | LG TV web applications | Web | HeadSpin |\n| [Linux (`@Itsmeaj`)](https://github.com/Itsmeaj/appium) | Linux desktop applications (X11, Wayland) | Native | Community (`@Itsmeaj`) |\n| [NovaWindows](https://github.com/AutomateThePlanet/appium-novawindows-driver) | Windows applications; a drop-in replacement for the official Windows driver | Native | Community / Automate The Planet |\n| [Roku](https://github.com/headspinio/appium-roku-driver) | Roku channels | Native | HeadSpin |\n| [TizenTV](https://github.com/headspinio/appium-tizen-tv-driver) | Tizen TV web applications | Web | HeadSpin |\n\nA few other community drivers exist for Linux, Tizen, and You.i Engine, but per the upstream catalog have not been maintained since 2020–2022 and target Appium 1 or require a custom install; check the [full catalog](https://github.com/appium/appium/blob/master/packages/appium/docs/en/ecosystem/drivers.md) before relying on one of these.\n","driver-ecosystem/uiautomator2-vs-espresso":"\nAppium's two official Android drivers each wrap a different Google testing framework: the [UiAutomator2 driver](https://github.com/appium/appium-uiautomator2-driver) wraps [UiAutomator](https://developer.android.com/training/testing/ui-automator), and the [Espresso driver](https://github.com/appium/appium-espresso-driver) wraps [Espresso](https://developer.android.com/training/testing/espresso). The two underlying frameworks take different approaches, which carries through to the driver built on top of each:\n\n| Aspect | UiAutomator2 | Espresso |\n| --- | --- | --- |\n| Underlying framework | [UiAutomator](https://developer.android.com/training/testing/ui-automator) | [Espresso](https://developer.android.com/training/testing/espresso) |\n| Speed | Slow | Fast |\n| Synchronization | Tests need to be synchronized manually | Supports auto synchronization |\n| Access to the app | Black box | Has access to the internals of the app |\n| Off-screen elements | Cannot find elements not rendered on the screen | Can find elements not rendered on the screen |\n| Android View Tag | Cannot be used to find a UI element | Can be used to find a UI element |\n| App knowledge required | Understanding of the app's implementation details is not needed | Understanding of the codebase is needed |\n| Best suited for | Automating UI functional tests | Automating unit tests |\n| Scope | Can test multiple apps and interact with the system | Can test only one app |\n| Jetpack Compose | No official support yet | Supported |\n| Learning curve | Easy to start with | Can be long |\n\nBecause UiAutomator2 treats the app as a black box with no code-level access, it fits Appium's usual role: black-box, cross-app functional testing where the tester doesn't need (or have) access to the app's source. Espresso's speed and internal access make it better suited to fast, in-process unit-style testing of a single app whose codebase the tester already understands — closer to what [Appium compared with platform-specific tools](/introduction/tool-comparison.md) already says about Espresso being the faster, close-to-application choice.\n","appium-setup/prerequisites":"\nGetting these prerequisites right before installing anything is worth the extra few minutes: skipping them is a common way to lose a week or more chasing setup problems that have nothing to do with Appium itself.\n\n# Baseline technical requirements\n\nThe Appium server itself needs, per the [System Requirements](https://github.com/appium/appium/blob/master/packages/appium/docs/en/quickstart/requirements.md) documentation:\n\n- A macOS, Linux, or Windows operating system.\n- [Node.js](https://nodejs.org), in the version range Appium's current release supports (check the [Appium documentation](https://appium.github.io/appium/docs/en/2.0/) for the exact range) — an LTS release is recommended.\n- [npm](https://npmjs.com) (bundled with Node.js, but upgradable independently).\n\nAppium itself is lightweight; it has no significant disk or RAM requirements on its own. Each driver, though, typically needs the full developer toolchain and SDK for its target platform (see [Appium ecosystem and drivers](/driver-ecosystem/index.md)). Every official driver ships with the Appium Doctor tool, which checks whether its specific requirements are satisfied — run it before assuming a failed session is Appium's fault.\n\n# Administrator access\n\nBe an administrator on the Windows or Mac machine you're setting up. Without admin rights, you may not be able to install Appium or the software it depends on (Node.js, Android SDK tools, Xcode, and so on).\n\n# Use a current OS version\n\nUse a current, supported version of Windows or macOS. Older, unsupported OS versions are more likely to hit compatibility issues with current Node.js, Android SDK, or Xcode releases.\n\n# Office machines: antivirus and company policy\n\nA personal machine is the easiest place to practice Appium. On an office machine, two things commonly block a setup that would otherwise work fine:\n\n- **Antivirus software** flagging or quarantining Appium or one of its dependencies.\n- **Company policy** restricting downloads from the internet, or blocking software installation (including Node.js) outright.\n\nIf either applies, this isn't something to troubleshoot alone — work with the admin or security team responsible for those policies, and make sure your account has admin privileges on the machine itself.\n\n# Emulators, simulators, and real devices\n\nAndroid emulators (and iOS simulators) are resource-hungry: they need a reasonably powerful processor and sufficient RAM to run without becoming a source of constant, unrelated test flakiness. Don't try to run them on an old, underpowered laptop — the frustration is rarely worth it.\n\nIf you have access to a real Android or iOS device, prefer it: a real device sits outside the host machine, so it doesn't compete with it for processing power or RAM the way an emulator or simulator does.\n\n# Device-specific restrictions\n\nSome Android OEMs ship custom security restrictions on top of stock Android that can block Appium's automation commands outright, independent of anything in your Appium setup. For example, in a [Realme 3 Pro issue on the Appium GitHub](https://github.com/appium/appium/issues/13802), an Appium maintainer's diagnosis was direct: the device has vendor-added security limitations, and the practical options are to use a different device for automation or contact the vendor about relaxing those restrictions. That issue's comment thread is worth reading in full — several people worked around it by enabling specific developer-options settings (for example, disabling \"permission monitoring\"), though the fix isn't guaranteed to be the same on every device or OS version.\n\n# When you hit an environment issue\n\nBefore assuming a problem is unique to you, search the [Appium GitHub issues page](https://github.com/appium/appium/issues) for it. You'll usually find either a solution, or confirmation that it's a known limitation you'll need to work around (as with the device-specific restrictions above).\n","appium-setup/windows/install-nodejs":"\nAppium's server is installed and launched from the command line — on Windows, from Command Prompt. Before installing Appium itself, Node.js and npm need to be in place: Appium's server is a Node.js application, and npm (the Node Package Manager) is what installs Node.js-based software, Appium included. See [Appium setup prerequisites](/appium-setup/prerequisites.md) for the environment checks to do before this step.\n\n# Check for an existing install\n\nOpen Command Prompt and run:\n\n```sh\nnode -v\nnpm -v\n```\n\nIf either command isn't recognized, Node.js — which bundles npm — isn't installed yet.\n\n# Download Node.js\n\nGo to [nodejs.org](https://nodejs.org) and download the **LTS** (Long Term Support) build for Windows, rather than the Current release — LTS is more stable. The Node.js installer bundles npm, so there's no separate npm install step.\n\n# Run the installer\n\n1. Launch the downloaded installer and select **Next**.\n2. Accept the license terms and select **Next**.\n3. Keep the default installation location and select **Next**. The installer confirms it will install both the Node.js runtime and the npm package manager.\n\nWith Node.js and npm installed, the next step is installing the Appium server itself with npm.\n","appium-setup/windows/install-appium-server":"\nWith Node.js and npm in place (see [Install Node.js and npm on Windows](/appium-setup/windows/install-nodejs.md)), the Appium server itself is installed as a global npm package from Command Prompt.\n\n# Install the server\n\n```sh\nnpm install -g appium@next\n```\n\nThe `@next` tag currently resolves to the Appium 2.x line. Once 2.x becomes npm's default `latest` tag, plain `npm install -g appium` will also pull it — but until then, use `@next` to be sure of getting Appium 2.x rather than the older 1.x server.\n\n# Expected output\n\nnpm typically prints a block of `npm warn deprecated ...` lines while installing — these come from transitive dependencies (packages like `glob`, `rimraf`, `uuid`, `gauge`, or `npmlog` pulled in indirectly) and are advisory only. They don't block the install and can be ignored.\n\nThe install succeeded if npm finishes with a summary line such as `added N packages in Xs` and there are no `npm ERR!` lines.\n\n# Verify the version after install\n\n```sh\nappium -v\n```\n\nThis should print a version number (e.g. `2.0.1`), confirming the `appium` command is on the PATH and working.\n\n# Explore the CLI\n\n```sh\nappium --help\n```\n\n```\nusage: index.js [-h] [-v] {server,driver,plugin,setup} ...\n\nA webdriver-compatible server that facilitates automation of web, mobile, and\nother types of apps across various platforms.\n\npositional arguments:\n  {server,driver,plugin,setup}\n    server              Start an Appium server\n    driver              Manage Appium drivers\n    plugin              Manage Appium plugins\n    setup               Batch install or uninstall Appium drivers and plugins\n\noptional arguments:\n  -h, --help            show this help message and exit\n  -v, --version         show program's version number and exit\n```\n\nThe four subcommands cover everything in this setup flow: bare `appium` (an implicit `appium server`) starts the server, `appium driver ...` is [checking and installing drivers](#check-installed-drivers), `appium plugin ...` manages optional plugins, and `appium setup` batch-installs a driver/plugin set in one command. Append `--help` to any subcommand (e.g. `appium driver --help`) for its own options.\n\n# Find where the server was installed\n\n`npm install -g` puts Appium in npm's global `node_modules` folder and drops a shim (`appium.cmd` for Command Prompt, `appium.ps1` for PowerShell) on the PATH so the bare `appium` command resolves to it. The commands to find both locations differ slightly by shell.\n\n**Command Prompt (cmd.exe):**\n\n```bat\nnpm root -g\nwhere appium\n```\n\n```\nC:\\Users\\<you>\\AppData\\Roaming\\npm\\node_modules\nC:\\Users\\<you>\\AppData\\Roaming\\npm\\appium\nC:\\Users\\<you>\\AppData\\Roaming\\npm\\appium.cmd\n```\n\n**PowerShell (Core / `pwsh`):**\n\n```powershell\nnpm root -g\n(Get-Command appium).Source\n```\n\n```\nC:\\Users\\<you>\\AppData\\Roaming\\npm\\node_modules\nC:\\Users\\<you>\\AppData\\Roaming\\npm\\appium.ps1\n```\n\n`npm root -g` is the same in both shells and points at the folder holding the actual package code (under `node_modules\\appium`); `where` (cmd) and `Get-Command` (PowerShell) instead resolve which shim on the PATH actually runs when you type `appium`.\n\nA quick visual check: open `node_modules\\appium\\lib` (under the `npm root -g` folder) in File Explorer. Seeing `main.js` there, alongside `appium.js`, `config.js`, and the rest of the server's source files, confirms the package installed correctly.\n\n![File Explorer showing node_modules\\appium\\lib with main.js present](/assets/images/install-appium-server-lib-folder.png)\n\n# Check installed drivers\n\nAppium 2.x ships the server only — platform drivers such as `uiautomator2` (Android) or `xcuitest` (iOS) are not bundled and must be installed separately.\n\n```sh\nappium driver list --installed\n```\n\nRight after a fresh server install, this comes back empty — no drivers installed yet:\n\n```\n✔ Listing installed drivers\n```\n\n```sh\nappium driver list\n```\n\nWithout `--installed`, this lists every driver in Appium's official driver registry, marking each as installed or not — useful for picking one:\n\n```\n✔ Listing available drivers\n- uiautomator2 [not installed]\n- xcuitest [not installed]\n- mac2 [not installed]\n- espresso [not installed]\n- safari [not installed]\n- gecko [not installed]\n- chromium [not installed]\n```\n\nOnce a driver is installed (see next section), it shows up in the `--installed` output along with its version, and its `[not installed]` tag disappears from the full list.\n\n# Next: install a driver\n\nInstalling a driver, e.g.:\n\n```sh\nappium driver install uiautomator2\n```\n\nis the next step, covered separately.\n\n# Confirm the driver installed\n\nRe-run the installed-drivers check from earlier:\n\n```sh\nappium driver list --installed\n```\n\nThe driver should now appear with its installed version, e.g. `- uiautomator2@3.x.x [installed]`, confirming it's ready to use.\n\n# Uninstall the server\n\nSince Appium was installed as a global npm package, removing it is a plain npm uninstall:\n\n```sh\nnpm uninstall -g appium\n```\n\nThis removes the `node_modules\\appium` package and its PATH shims (`appium.cmd` / `appium.ps1`) from the location found earlier. It does not remove installed drivers or their SDKs (e.g. Android SDK) — uninstall a driver first with `appium driver uninstall <name>` if it should go too. Confirm removal with:\n\n```sh\nappium -v\n```\n\nwhich should now fail with a \"not recognized\" error (cmd) or \"not recognized as a name of a cmdlet\" error (PowerShell).\n","appium-setup/windows/setup-android-sdk":"\nThe `uiautomator2` driver — Appium's Android driver, [installed earlier](install-appium-server.md) — needs the Android SDK (for `adb` and the other tools it shells out to) and a JDK, neither of which ship with Appium itself. The Android SDK can technically be installed standalone, but Android Studio is the preferred route today, especially if you'll use the Android Emulator and Android Virtual Devices (AVDs) rather than only a real device — Android Studio bundles the SDK Manager and AVD Manager alongside it.\n\n# System requirements\n\nBefore installing, make sure the machine can actually handle it:\n\n- **Android Studio itself**: at least 8 GB RAM and 8 GB free disk space.\n- **Each Android Virtual Device**: roughly 8-10 GB of disk space per AVD — more if you plan to keep several around.\n- Underpowered or low-disk machines are a common source of \"nothing works\" frustration with the emulator specifically; a real device sidesteps this (see [Set up a real Android device](setup-real-device.md)) if the hardware is a constraint.\n- **Virtualization**: running an AVD through the emulator needs hardware virtualization enabled — Intel VT-x or AMD-V, enabled in the BIOS/UEFI (settings and menu names vary by manufacturer; search for your specific board/laptop model). This is only needed for the emulator — a real device doesn't require it.\n\n# Install Android Studio\n\n1. Download the installer from [developer.android.com/studio](https://developer.android.com/studio) — it detects your OS automatically.\n2. Accept the license terms and start the download.\n3. Run the installer: **Next** → keep both components checked (Android Studio and Android Virtual Device) → **Next** → keep the default install location → **Next** → **Install**.\n4. Once installation finishes, **Next** → check the box to start Android Studio → **Finish**.\n\n# Install the SDK\n\nOn first launch, Android Studio reports **\"No Android SDK found\"** — this step installs it, so don't skip it:\n\n1. **Next** through the SDK Setup Wizard, with all the default components selected.\n2. Note the **SDK install location** shown on this screen (default is `C:\\Users\\<you>\\AppData\\Local\\Android\\Sdk`) — you'll need it shortly for `ANDROID_HOME`.\n3. Confirm enough disk space is available, then **Next** → **Finish**. Expand **Show Details** to watch the component downloads if you want to confirm progress.\n\n# Confirm SDK components in the SDK Manager\n\nFrom Android Studio's welcome screen (or **More Actions → SDK Manager** once a project is open):\n\n**SDK Platforms tab** — shows installed Android versions (e.g. Android 12 / API 31 shown as \"Installed\" by default). Checking a platform's checkbox expands its sub-components; confirm **Android SDK Platform** and **Sources for Android SDK** are installed for at least one version. The **system image** isn't needed yet — that's installed later when creating an AVD. Select and **Apply** any additional platform version you specifically need.\n\n**SDK Tools tab** — confirm these are checked:\n- **Android Emulator**\n- **Android SDK Platform-Tools**\n- **Android SDK Build-Tools**\n- **Android SDK Command-line Tools (latest)** — not checked by default; check it. (Without it, `appium driver doctor` later flags `apkanalyzer.bat` as missing.)\n\nTwo more items appear here but aren't needed yet: **Intel x86 Emulator Accelerator (HAXM)** or the **Android Emulator Hypervisor Driver** (AMD) — these matter only when actually creating and running an AVD, covered separately. If you'll use a real Android device instead, you'll want the matching USB driver — see [Set up a real Android device](setup-real-device.md).\n\nClick **Apply**, accept the license agreement, and let the components install, then **Finish** and close the SDK Manager.\n\n# Set ANDROID_HOME and PATH\n\n1. Open the Start menu, type **\"edit the system environment variables\"**, and open it (Control Panel's System Properties, Advanced tab).\n2. Click **Environment Variables**.\n3. Under **System variables**, click **New**. Set the variable name to `ANDROID_HOME` and the value to the SDK path noted earlier (also visible any time from the SDK Manager) — e.g. `C:\\Users\\<you>\\AppData\\Local\\Android\\Sdk`. Click **OK**.\n4. Still under **System variables**, select **Path** and click **Edit**. Add two new entries:\n   - `%ANDROID_HOME%\\platform-tools`\n   - `%ANDROID_HOME%\\cmdline-tools\\latest\\bin`\n5. Click **OK** on every open dialog to save.\n\nIf `%ANDROID_HOME%\\cmdline-tools` doesn't exist when you get here, the **Android SDK Command-line Tools** component from the previous section wasn't actually installed — a common gap, since it's unchecked by default and easy to skip. Go back to the SDK Manager's **SDK Tools** tab, check it, and **Apply**; the folder appears once that finishes. In the meantime, skip that PATH entry — it only affects the optional `apkanalyzer.bat` check later, not `adb` or core Appium functionality.\n\n# Confirm the SDK folders\n\nInside the SDK folder (`%ANDROID_HOME%`), these should all exist:\n\n- `platform-tools\\adb.exe` — **adb** (Android Debug Bridge), the tool Appium uses internally to talk to devices/emulators (install apps, launch apps, and more; also usable directly from the command line).\n- `cmdline-tools\\latest\\bin\\` — command-line tools, including `.bat` files Appium also uses internally.\n- `emulator\\emulator.exe` — used to launch AVDs, also used internally by Appium.\n\n# Verify\n\nEnvironment variable changes don't apply to already-open terminals — **close and reopen** Command Prompt before testing:\n\n```bat\nadb\necho %ANDROID_HOME%\necho %PATH%\n```\n\n`adb` should run (rather than \"not recognized\"), and both `echo` commands should resolve to the SDK path and include the `platform-tools`/`cmdline-tools\\latest\\bin` entries.\n\nThen run Appium's own diagnostic for the driver:\n\n```sh\nappium driver doctor uiautomator2\n```\n\nBefore `ANDROID_HOME` is set, this fails outright:\n\n```\n✖ ANDROID_HOME environment variable is NOT set!\n✖ adb, emulator, apkanalyzer.bat could not be found because ANDROID_HOME is NOT set!\n✔ JAVA_HOME is set to: C:\\Program Files\\Microsoft\\jdk-25.0.4.101-hotspot\\\n...\nError: ✖ Treatment required\n```\n\nOnce `ANDROID_HOME` and PATH are set correctly:\n\n```\n✔ ANDROID_HOME is set to: C:\\Users\\<you>\\AppData\\Local\\Android\\Sdk\n  'adb' exists in C:\\Users\\<you>\\AppData\\Local\\Android\\Sdk\\platform-tools\\adb.exe\n  'emulator' exists in C:\\Users\\<you>\\AppData\\Local\\Android\\Sdk\\emulator\\emulator.exe\n✔ JAVA_HOME is set to: C:\\Program Files\\Microsoft\\jdk-25.0.4.101-hotspot\\\n```\n\n`apkanalyzer.bat`, `bundletool.jar`, and `gst-launch-1.0.exe`/`gst-inspect-1.0.exe` may still show as missing — these are optional (APK bundle inspection and device screen streaming respectively) and aren't required for typical Appium session automation. `apkanalyzer.bat` specifically comes from the **Android SDK Command-line Tools** package installed above, if you want to clear that one too.\n\n# JDK\n\nAppium also needs `JAVA_HOME` pointing at a JDK — Android Studio bundles its own under its install directory if you don't already have one. Set `JAVA_HOME` the same way as `ANDROID_HOME` above, e.g. `C:\\Program Files\\Microsoft\\jdk-25.0.4.101-hotspot\\`.\n\nWith the SDK and JDK in place, the next step is either [setting up a real Android device](setup-real-device.md) or creating an AVD, then running a session through [Appium Inspector](install-appium-inspector.md) to confirm everything end-to-end.\n","appium-setup/windows/install-appium-inspector":"\nWith the [Appium server installed](install-appium-server.md) and at least one driver in place, Appium Inspector is the next step: a standalone desktop app for inspecting an app's UI and building element locators, and the easiest way to confirm the whole setup — server, driver, and target app or emulator — actually works together.\n\n# Download and install\n\nAppium Inspector isn't installed via npm; it's a separate desktop app. Go to the [Appium Inspector releases page](https://github.com/appium/appium-inspector/releases) on GitHub and download the latest Windows installer (a `.exe` asset, typically named like `Appium-Inspector-*-win-x64.exe`). Run the installer and step through the wizard:\n\n1. **Choose Installation Options** — install for all users, or just the current user (the simpler choice on a personal machine, no admin prompt needed).\n\n   ![Appium Inspector installer: Choose Installation Options screen](/assets/images/install-appium-inspector-wizard-screen1.png)\n\n2. **Choose Install Location** — the default per-user path under `AppData\\Local\\Programs\\Appium Inspector` is fine; change it only if you have a reason to.\n\n   ![Appium Inspector installer: Choose Install Location screen](/assets/images/install-appium-inspector-wizard-screen2.png)\n\n3. Select **Install**, then **Finish** once setup completes.\n\n   ![Appium Inspector installer: Completing Appium Inspector Setup screen](/assets/images/install-appium-inspector-wizard-screen3.png)\n\n# Start the Appium server\n\nAppium Inspector connects to a running Appium server rather than starting one itself. In a Command Prompt window:\n\n```sh\nappium\n```\n\nLeave this running — it should print the server address (default `http://127.0.0.1:4723`) — and do the rest in Appium Inspector.\n\n## Known warnings on first start\n\nTwo warnings are common on a fresh setup and don't block the server from starting:\n\n```\n(node:24692) [DEP0190] DeprecationWarning: Passing args to a child process with shell option true can lead to security vulnerabilities, as the arguments are not escaped, only concatenated.\nWARN Appium Driver \"uiautomator2\" has 1 potential problem:\nWARN Appium   - Driver \"uiautomator2\" (package `appium-uiautomator2-driver`) may be incompatible with the current version of Appium (v2.0.1) due to its peer dependency on older Appium v^3.0.0-rc.2. Please ask the developer of `appium-uiautomator2-driver` to update the peer dependency on Appium to v2.0.1\n```\n\n- The `DEP0190` notice is a Node.js runtime warning about how a dependency spawns a child process internally — it comes from Appium's own dependency tree, not from anything in your setup, is purely cosmetic, and isn't fixed by any version change.\n- The `uiautomator2` peer-dependency warning is fixable. It appears because `appium driver install uiautomator2` pulls the newest driver release, which targets Appium's upcoming 3.x prerelease line rather than 2.x. Two changes clear it:\n\n  ```sh\n  appium driver uninstall uiautomator2\n  appium driver install uiautomator2@4.2.9\n  npm install -g appium@2.19.0\n  ```\n\n  `4.2.9` is the newest `uiautomator2` driver release whose peer dependency (`^2.4.1 || ^3.0.0-beta.0`) still accepts an Appium 2.x server; `2.19.0` is the latest Appium 2.x release, satisfying that `≥2.4.1` floor (a plain `npm install -g appium@next` earlier in this bundle's setup steps lands on an older 2.x snapshot that doesn't). Check the current latest versions of each with `npm view appium-uiautomator2-driver versions` / `npm view appium versions` before reusing these exact numbers, since both move over time.\n\n# Configure a session in Appium Inspector\n\n1. Launch Appium Inspector.\n2. Set the **Remote Host** to `127.0.0.1` and **Remote Port** to `4723` (the running server from the previous step), or paste the full **Remote Path** shown in the server's startup output.\n3. Provide the desired capabilities for the session as JSON — at minimum the driver-specific `platformName` and `automationName` (e.g. `UiAutomator2` for Android), plus either `app` (a path to the app under test) or the app's package/activity for an app already installed on the target device or emulator.\n4. Select **Start Session**.\n\n# Verify the setup\n\nIf the session starts, Appium Inspector shows a live screenshot of the app with its UI hierarchy alongside it — selecting an element surfaces its locators (id, accessibility id, XPath, and so on). A successful session here confirms the server, the driver, and the target app or emulator are all correctly wired together; if it fails, the error Appium Inspector reports is usually more specific than a bare `appium driver doctor` check and points at exactly what's misconfigured (missing capability, device not connected, app path wrong, and so on).\n","appium-setup/windows/setup-real-device":"\nAutomating a real Android device with Appium (rather than an emulator) has one hard prerequisite: **USB debugging** must be enabled on the device. Without it, Appium's `uiautomator2` driver can't talk to the device over `adb` at all. The exact menu steps below can vary slightly by manufacturer (OEM), but the underlying setting — USB debugging under Developer options — is the same across Android versions.\n\n# Enable Developer options and USB debugging\n\n1. On the device, open **Settings → About phone**, and tap **Build number** seven times. A toast confirms \"You are now a developer.\"\n2. Go back to **Settings**, where a new **Developer options** menu now appears (usually under System, or directly in the main Settings list depending on the OEM's skin).\n3. Inside Developer options, enable **USB debugging**.\n4. Connect the device to the Windows machine with a USB cable. On the device, a prompt appears asking to allow USB debugging from this computer — accept it (optionally checking \"Always allow from this computer\" to skip the prompt on future connections).\n\n# USB drivers\n\nThe first time you connect an Android device, Windows usually installs the necessary USB driver automatically, and in most cases that's all that's needed. If the device still isn't recognized (check **Device Manager** for an unrecognized or misbehaving entry), install the driver manually:\n\n- **Google devices** (Pixel and other Google-branded hardware): [Google USB Driver](https://developer.android.com/studio/run/win-usb) from the official Android developer docs.\n- **OEM devices** (Samsung, and other manufacturers running Android on their own hardware): [OEM USB Drivers](https://developer.android.com/studio/run/oem-usb), which links out to each manufacturer's own driver.\n\n# Verify the connection with Vysor\n\n[Vysor](https://www.vysor.io/) is a standalone app that mirrors an Android device's screen onto Windows or Mac. It isn't part of the Appium toolchain, but it shares Appium's exact prerequisite — USB debugging enabled — which makes it a convenient way to confirm the device/driver/cable setup works *before* troubleshooting anything Appium-specific.\n\n1. Download Vysor for Windows from [vysor.io](https://www.vysor.io/) and run the installer.\n2. Launch Vysor with the device connected. If USB debugging is enabled and the driver is working, Vysor detects the device automatically and offers to mirror it.\n3. If Vysor instead reports **\"No Android devices connected,\"** that confirms the problem is upstream of Appium — revisit USB debugging (above) and the driver install. Vysor's own screen links directly to both the USB-debugging steps and the ADB driver download if it doesn't detect a device.\n\nOnce Vysor mirrors the device successfully, it's ready for Appium: continue to [Appium Inspector](install-appium-inspector.md) and use the device's package/activity (instead of an emulator) as the session's capabilities.\n"},"types":["Reference","Topic"],"palette":{"Topic":"#1e5d52","Reference":"#9a6a2f"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
